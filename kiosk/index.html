<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แหม่มเบเกอรี่ — ระบบลงเวลา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&family=Kanit:wght@700;800;900&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
:root {
  --bg:#0D0906; --surface:#1A110B; --card:#241710; --gold:#D4A017;
  --gold-dim:#8A6A10; --cream:#F5E6D3; --green:#4CAF82; --red:#E05252;
  --text:#EDE0D0; --muted:#7A6558; --border:#3A2820;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;}
#app{display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto 1fr;height:100vh;}
#header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--border);}
#main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;}
#sidebar{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.logo{font-family:'Kanit',sans-serif;font-size:22px;font-weight:900;color:var(--gold);}
.logo span{color:var(--cream);font-weight:300;}
#clock{text-align:right;}
#time-display{font-family:'Kanit',sans-serif;font-size:40px;font-weight:800;color:var(--gold);line-height:1;}
#date-display{font-size:13px;color:var(--muted);}
#cam-wrapper{position:relative;width:380px;height:285px;border-radius:16px;overflow:hidden;border:3px solid var(--border);background:#000;}
#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
#canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);}
#cam-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.face-frame{width:200px;height:220px;border:3px solid var(--gold-dim);border-radius:50%;opacity:.5;transition:border-color .3s,opacity .3s,box-shadow .3s;}
.face-frame.detected{border-color:var(--green);opacity:1;}
.face-frame.matched{border-color:var(--gold);opacity:1;box-shadow:0 0 30px var(--gold);}
#status-card{width:380px;background:var(--card);border-radius:14px;padding:20px 24px;border:1px solid var(--border);text-align:center;}
#status-icon{font-size:40px;margin-bottom:8px;}
#status-name{font-family:'Kanit',sans-serif;font-size:24px;font-weight:700;color:var(--cream);}
#status-msg{font-size:15px;color:var(--muted);margin-top:4px;}
#status-badge{display:inline-block;margin-top:10px;padding:4px 16px;border-radius:20px;font-size:13px;font-weight:600;}
.badge-in{background:#1A3A2A;color:var(--green);}
.badge-out{background:#3A1A1A;color:var(--red);}
.badge-idle{background:#2A2218;color:var(--gold-dim);}
#countdown-wrap{display:flex;align-items:center;gap:16px;height:60px;}
#countdown-ring{width:60px;height:60px;display:none;}
#countdown-ring.active{display:block;}
#countdown-ring circle{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-dasharray:163;stroke-dashoffset:163;transform:rotate(-90deg);transform-origin:center;}
#gps-status{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px;}
.gps-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
.gps-dot.ok{background:var(--green);}
.gps-dot.fail{background:var(--red);}
#sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);}
#sidebar-header h3{font-family:'Kanit',sans-serif;font-size:14px;color:var(--gold);font-weight:700;}
#scan-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.scan-entry{background:var(--card);border-radius:10px;padding:12px 14px;border-left:3px solid var(--border);font-size:13px;}
.scan-entry.in{border-left-color:var(--green);}
.scan-entry.out{border-left-color:var(--red);}
.scan-entry.fail{border-left-color:var(--muted);}
.scan-entry .se-name{font-weight:700;color:var(--cream);}
.scan-entry .se-time{color:var(--gold);font-weight:600;}
.scan-entry .se-msg{color:var(--muted);margin-top:2px;}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.new-entry{animation:slideIn .3s ease;}
#loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:100;}
#loading-overlay.hidden{display:none;}
.spinner{width:60px;height:60px;border:4px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{color:var(--gold);font-size:16px;}
.load-sub{color:var(--muted);font-size:13px;}
#result-flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s;background:rgba(0,0,0,.6);}
#result-flash.show{opacity:1;}
.flash-inner{background:var(--card);border-radius:24px;padding:40px 60px;text-align:center;border:2px solid var(--border);box-shadow:0 20px 80px rgba(0,0,0,.8);}
.flash-emoji{font-size:72px;display:block;margin-bottom:12px;}
.flash-name{font-family:'Kanit',sans-serif;font-size:32px;font-weight:800;color:var(--cream);}
.flash-action{font-size:20px;margin-top:8px;font-weight:600;}
.flash-time{font-size:14px;color:var(--muted);margin-top:6px;}
.flash-inner.success{border-color:var(--green);}
.flash-inner.error{border-color:var(--red);}
#no-api-warn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#3A1A1A;color:var(--red);padding:10px 24px;border-radius:10px;font-size:13px;display:none;}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="load-text">กำลังโหลดระบบจดจำใบหน้า...</div>
  <div class="load-sub" id="load-step">เริ่มต้น...</div>
</div>

<div id="result-flash">
  <div class="flash-inner" id="flash-box">
    <span class="flash-emoji" id="flash-emoji">✅</span>
    <div class="flash-name" id="flash-name">พนักงาน</div>
    <div class="flash-action" id="flash-action"></div>
    <div class="flash-time" id="flash-time"></div>
  </div>
</div>

<div id="no-api-warn">⚠️ ยังไม่ได้ตั้งค่า API URL — ไปที่ Admin &gt; ตั้งค่า</div>

<div id="app">
  <header id="header">
    <div>
      <div class="logo">🥐 แหม่มเบเกอรี่ <span>ระบบลงเวลา</span></div>
      <div id="gps-status"><span class="gps-dot" id="gps-dot"></span><span id="gps-text">กำลังตรวจ GPS...</span></div>
    </div>
    <div id="clock">
      <div id="time-display">--:--:--</div>
      <div id="date-display">กำลังโหลด...</div>
    </div>
  </header>

  <main id="main">
    <div id="cam-wrapper">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
      <div id="cam-overlay"><div class="face-frame" id="face-frame"></div></div>
    </div>

    <div id="status-card">
      <div id="status-icon">👁️</div>
      <div id="status-name">กำลังสแกนใบหน้า...</div>
      <div id="status-msg">วางหน้าตรงกรอบสีทอง</div>
      <div id="status-badge" class="badge-idle">รอการสแกน</div>
    </div>

    <div id="countdown-wrap">
      <svg id="countdown-ring" viewBox="0 0 56 56"><circle cx="28" cy="28" r="26" id="ring-circle"/></svg>
      <div style="font-size:13px;color:var(--muted)" id="reset-label"></div>
    </div>
  </main>

  <aside id="sidebar">
    <div id="sidebar-header"><h3>📋 บันทึกการสแกนล่าสุด</h3></div>
    <div id="scan-log"><div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">ยังไม่มีการสแกน</div></div>
  </aside>
</div>

<script>
var API_URL = localStorage.getItem('gasApiUrl') || '';
var GPS_ENABLED = localStorage.getItem('gpsEnabled') !== 'false';
var GPS_LAT = parseFloat(localStorage.getItem('gpsLat') || '13.7563');
var GPS_LNG = parseFloat(localStorage.getItem('gpsLng') || '100.5018');
var GPS_RADIUS = parseFloat(localStorage.getItem('gpsRadius') || '200');
var MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';

var employees = [], faceMatcher = null, isProcessing = false;
var lastGPS = null, gpsOk = !GPS_ENABLED;
var audioCtx = null;
var lastEmpFetch = 0;
var THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var THAI_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

// CLOCK
function updateClock() {
  var now = new Date();
  var h = now.getHours().toString().padStart(2,'0');
  var m = now.getMinutes().toString().padStart(2,'0');
  var s = now.getSeconds().toString().padStart(2,'0');
  document.getElementById('time-display').textContent = h+':'+m+':'+s;
  var bYear = now.getFullYear()+543;
  document.getElementById('date-display').textContent = 'วัน'+THAI_DAYS[now.getDay()]+' '+now.getDate()+' '+THAI_MONTHS[now.getMonth()]+' พ.ศ. '+bYear;
}
setInterval(updateClock, 1000); updateClock();

// GPS
function startGPS() {
  if (!GPS_ENABLED) { gpsOk = true; updateGPSUI(true,'ปิดใช้งาน GPS'); return; }
  if (!navigator.geolocation) { updateGPSUI(false,'ไม่รองรับ GPS'); return; }
  navigator.geolocation.watchPosition(function(pos) {
    lastGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    var dist = getDistance(lastGPS.lat, lastGPS.lng, GPS_LAT, GPS_LNG);
    gpsOk = dist <= GPS_RADIUS;
    updateGPSUI(gpsOk, gpsOk ? 'อยู่ในพื้นที่ ('+Math.round(dist)+'m)' : 'นอกพื้นที่ '+Math.round(dist)+'m');
  }, function(err) { updateGPSUI(false,'GPS: '+err.message); }, { enableHighAccuracy:true, maximumAge:10000 });
}
function getDistance(lat1,lng1,lat2,lng2) {
  var R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function updateGPSUI(ok, text) {
  document.getElementById('gps-dot').className = 'gps-dot '+(ok?'ok':'fail');
  document.getElementById('gps-text').textContent = text;
}

// AUDIO
function beep(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'success') {
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime+0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.5);
      osc.start(); osc.stop(audioCtx.currentTime+0.5);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.4);
      osc.start(); osc.stop(audioCtx.currentTime+0.4);
    }
  } catch(e) {}
}

// EMPLOYEES CACHE
async function loadEmployees() {
  if (!API_URL) return;
  if (Date.now()-lastEmpFetch < 300000 && employees.length > 0) return;
  try {
    var res = await fetch(API_URL+'?action=getEmployees');
    var data = await res.json();
    employees = (data||[]).filter(function(e){ return e.hasFace && e.status==='Active'; });
    buildMatcher();
    lastEmpFetch = Date.now();
  } catch(e) { console.warn('โหลดพนักงานล้มเหลว:', e.message); }
}
function buildMatcher() {
  if (!window.faceapi || !employees.length) return;
  try {
    var labeled = employees.map(function(emp) {
      var descs = [emp.face1,emp.face2,emp.face3].filter(Boolean).map(function(d){ return new Float32Array(JSON.parse(d)); });
      return new faceapi.LabeledFaceDescriptors(emp.empID, descs);
    });
    if (labeled.length) faceMatcher = new faceapi.FaceMatcher(labeled, 0.48);
  } catch(e) { console.error('buildMatcher error:', e); }
}

// MODELS
async function loadModels() {
  setLoad('กำลังโหลด Face Detector...');
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  setLoad('กำลังโหลด Face Landmarks...');
  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
  setLoad('กำลังโหลด Face Recognition...');
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  setLoad('โหลดข้อมูลพนักงาน...');
  await loadEmployees();
}
function setLoad(t) { document.getElementById('load-step').textContent = t; }

// CAMERA
async function startCamera() {
  var video = document.getElementById('video');
  var stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480, facingMode:'user' } });
  video.srcObject = stream;
  return new Promise(function(resolve){ video.onloadedmetadata = resolve; });
}

// DETECTION LOOP
var detOpts;
async function detectLoop() {
  if (isProcessing) return;
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  var ctx = canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
  var frame = document.getElementById('face-frame');

  var detection = await faceapi.detectSingleFace(video, detOpts).withFaceLandmarks(true).withFaceDescriptor();

  if (detection) {
    var box = detection.detection.box;
    ctx.strokeStyle = '#D4A017'; ctx.lineWidth = 3;
    ctx.strokeRect(box.x, box.y, box.width, box.height);
    frame.className = 'face-frame detected';
    if (faceMatcher) {
      var result = faceMatcher.findBestMatch(detection.descriptor);
      if (result.label !== 'unknown') {
        var emp = employees.find(function(e){ return e.empID === result.label; });
        if (emp) { isProcessing = true; await handleMatch(emp); return; }
      }
    }
  } else {
    frame.className = 'face-frame';
    setStatus('👁️','กำลังสแกนใบหน้า...','วางหน้าตรงกรอบสีทอง','idle');
  }
  setTimeout(detectLoop, 600);
}

// HANDLE MATCH
async function handleMatch(emp) {
  document.getElementById('face-frame').className = 'face-frame matched';
  if (GPS_ENABLED && !gpsOk) {
    showFlash(false,'⛔',emp.name,'นอกพื้นที่ที่กำหนด','');
    beep('fail'); addLog(emp.name,'','นอกพื้นที่','fail');
    await doReset(3000); return;
  }
  var gpsStr = lastGPS ? lastGPS.lat.toFixed(6)+','+lastGPS.lng.toFixed(6) : '';
  try {
    var statusRes = await apiGet('getTodayStatus', {empID: emp.empID});
    var isIn = statusRes.status === 'in';
    var action = isIn ? 'clockOut' : 'clockIn';
    var res = await apiPost({action:action, empID:emp.empID, name:emp.name, gps:gpsStr});
    if (res.error) {
      showFlash(false,'⚠️',emp.name,res.error,''); beep('fail'); addLog(emp.name,'',res.error,'fail');
    } else {
      var now = new Date();
      var t = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
      var actionThai = action === 'clockIn' ? '✅ เข้างาน' : '👋 ออกงาน';
      showFlash(true, action==='clockIn'?'✅':'👋', emp.name, actionThai, t);
      beep('success'); addLog(emp.name,t,actionThai, action==='clockIn'?'in':'out');
    }
  } catch(e) {
    showFlash(true,'📴',emp.name,'บันทึก Offline (จะ sync เมื่อมีเน็ต)',''); beep('success');
  }
  await doReset(3000);
}

// FLASH
function showFlash(ok, emoji, name, action, time) {
  document.getElementById('flash-emoji').textContent = emoji;
  document.getElementById('flash-name').textContent = name;
  document.getElementById('flash-action').textContent = action;
  document.getElementById('flash-time').textContent = time;
  document.getElementById('flash-box').className = 'flash-inner '+(ok?'success':'error');
  document.getElementById('result-flash').className = 'show';
}
function hideFlash() { document.getElementById('result-flash').className = ''; }

async function doReset(ms) {
  var ring = document.getElementById('countdown-ring');
  var circle = document.getElementById('ring-circle');
  var label = document.getElementById('reset-label');
  ring.className = 'active'; label.textContent = 'รีเซ็ตอัตโนมัติใน 3 วินาที';
  var steps = ms/1000, elapsed = 0;
  var iv = setInterval(function(){
    elapsed++;
    circle.style.strokeDashoffset = 163-(163*elapsed/steps);
    label.textContent = 'รีเซ็ตอัตโนมัติใน '+(steps-elapsed)+' วินาที';
  }, 1000);
  await new Promise(function(r){ setTimeout(r, ms); });
  clearInterval(iv);
  ring.className = ''; circle.style.strokeDashoffset = 163; label.textContent = '';
  hideFlash();
  document.getElementById('face-frame').className = 'face-frame';
  setStatus('👁️','กำลังสแกนใบหน้า...','วางหน้าตรงกรอบสีทอง','idle');
  await loadEmployees();
  isProcessing = false;
  detectLoop();
}

function setStatus(icon, name, msg, type) {
  document.getElementById('status-icon').textContent = icon;
  document.getElementById('status-name').textContent = name;
  document.getElementById('status-msg').textContent = msg;
  var b = document.getElementById('status-badge');
  b.className = 'badge-'+(type||'idle');
  b.textContent = {in:'เข้างาน',out:'ออกงาน',idle:'รอการสแกน',fail:'ล้มเหลว'}[type]||'รอการสแกน';
}

function addLog(name, time, action, type) {
  var log = document.getElementById('scan-log');
  if (log.children.length===1 && !log.children[0].classList.contains('scan-entry')) log.innerHTML = '';
  var el = document.createElement('div');
  el.className = 'scan-entry '+type+' new-entry';
  el.innerHTML = '<div class="se-name">'+name+' <span class="se-time">'+(time||'')+'</span></div><div class="se-msg">'+action+'</div>';
  log.insertBefore(el, log.firstChild);
  if (log.children.length > 20) log.removeChild(log.lastChild);
}

async function apiGet(action, params) {
  var url = API_URL+'?action='+action;
  if (params) Object.keys(params).forEach(function(k){ url += '&'+k+'='+encodeURIComponent(params[k]); });
  return (await fetch(url)).json();
}
async function apiPost(body) {
  return (await fetch(API_URL, {method:'POST', body:JSON.stringify(body)})).json();
}

async function init() {
  if (!API_URL) document.getElementById('no-api-warn').style.display = 'block';
  startGPS();
  document.body.addEventListener('click', function(){ if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }, {once:true});
  try {
    await startCamera();
    await loadModels();
    detOpts = new faceapi.TinyFaceDetectorOptions({inputSize:320, scoreThreshold:0.5});
    document.getElementById('loading-overlay').className = 'hidden';
    detectLoop();
    setInterval(loadEmployees, 5*60000);
  } catch(e) {
    document.getElementById('load-step').textContent = 'เกิดข้อผิดพลาด: '+e.message;
  }
}
window.addEventListener('load', init);
</script>
</body>
</html>
